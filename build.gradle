plugins {
	id 'java'
}

group = 'com.custom'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.0'
    implementation 'org.mockito:mockito-core:5.10.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
